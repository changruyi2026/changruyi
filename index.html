<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>常如意工作台</title>
  <meta name="theme-color" content="#E0A98A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="常如意工作台" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=26" />
</head>
<body>
  <div class="app">
    <!-- 侧边导航 -->
    <aside class="sidebar">
      <div class="logo" title="常如意工作台">
        <span class="logo-sprout" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40">
            <path d="M24 40 V24" stroke="#CD8E6B" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M24 28 C16 28 11 22 11 14 C19 14 24 20 24 28 Z" fill="#E0A98A"/>
            <path d="M24 24 C32 24 37 18 37 10 C29 10 24 16 24 24 Z" fill="#CD8E6B"/>
            <circle cx="24" cy="42" r="3" fill="#E9C7A1"/>
          </svg>
        </span>
        <span class="logo-text">常如意<br/><b>工作台</b></span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="home">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </span>
          <span class="nav-txt">首页</span>
          <span class="nav-badge" id="navBadgeHome" style="display:none">①</span>
        </button>
        <button class="nav-item" data-view="hongshu">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
          </span>
          <span class="nav-txt">红薯日历</span>
        </button>
        <button class="nav-item" data-view="xhs">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12h8M12 8v8"/></svg>
          </span>
          <span class="nav-txt">红薯概况</span>
        </button>
        <button class="nav-item" data-view="baby">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
          </span>
          <span class="nav-txt">女鹅记录</span>
        </button>
        <button class="nav-item" data-view="ledger">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1.5c1.5 0 2.5 1 2.5 2.5S13.5 13 12 13s-2.5 1-2.5 2.5S10.5 18 12 18a2.5 2.5 0 0 0 2.5-1.5"/></svg>
          </span>
          <span class="nav-txt">记账</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <span class="sprout-mini" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26">
            <path d="M16 28 V16" stroke="#CD8E6B" stroke-width="2.4" stroke-linecap="round" fill="none"/>
            <path d="M16 19 C11 19 8 15 8 10 C13 10 16 14 16 19 Z" fill="#E0A98A"/>
            <path d="M16 16 C21 16 24 12 24 7 C19 7 16 11 16 16 Z" fill="#CD8E6B"/>
          </svg>
        </span>
        <small>慢慢来，比较快 🌿</small>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">首页</h1>
          <p id="viewSub" class="view-sub">今天也要闪闪发光呀</p>
        </div>
        <div class="topbar-right">
          <div class="sync-pill" id="syncPill" title="云端同步状态">
            <span class="sync-dot" id="syncDot"></span><span id="syncTxt">未连接</span>
          </div>
          <div class="today-pill" id="topDate">—</div>
        </div>
      </header>

      <div class="views">
        <section class="view active" id="view-home"></section>
        <section class="view" id="view-hongshu"></section>
        <section class="view" id="view-xhs"></section>
        <section class="view" id="view-baby"></section>
        <section class="view" id="view-ledger"></section>
      </div>
    </main>
  </div>

  <!-- 弹窗根 -->
  <div class="modal-root" id="modalRoot"></div>
  <!-- 提示 -->
  <div class="toast-root" id="toastRoot"></div>

  <script src="supabase.min.js"></script>
  <script src="app.js?v=26"></script>
</body>
</html>
